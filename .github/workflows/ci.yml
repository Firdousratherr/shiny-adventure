name: Zenvora CI

# CI trigger enabled for branch validation

concurrency:
  group: zenvora-ci-${{ github.ref }}
  # Keep each validation run observable; rapid pushes should not silently cancel CI.\n  cancel-in-progress: false

on:
  push:
    branches: ["main", "build/admin-order-management-final4", "build/dropshipping-store", "fix/meesho-product-image-extraction", "feature/meesho-auto-shopify-import"]
  pull_request:
    branches: ["main", "build/dropshipping-store", "build/admin-order-management-final4", "fix/meesho-product-image-extraction"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/zenvora
      DIRECT_URL: postgresql://ci:ci@localhost:5432/zenvora
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zenvora
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci -d zenvora" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
