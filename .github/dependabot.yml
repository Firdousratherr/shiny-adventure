version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    groups:
      framework:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      auth:
        patterns:
          - "next-auth"
          - "@auth/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
